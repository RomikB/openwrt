# Disable bridge netfilter packet dropping for Qualcomm PPE hardware acceleration
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-arptables = 0
net.bridge.bridge-nf-call-ip6tables = 0

# Set netfilter connection tracking limit for 256MB RAM (~176MB HLOS, ~2.6MB slab cost)
net.netfilter.nf_conntrack_max = 8192
